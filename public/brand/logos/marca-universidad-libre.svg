<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" aria-label="UniFind — Universidad Libre">
  <defs>
    <!-- Institutional gradients -->
    <linearGradient id="unilibre-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE1B38" />
      <stop offset="100%" stop-color="#A50D26" />
    </linearGradient>
    <linearGradient id="unilibre-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#B89600" />
      <stop offset="100%" stop-color="#8A6400" />
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#B89600" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A1A1A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Crest Shield -->
  <path
    d="M60 6 L104 22 C104 68 84 98 60 114 C36 98 16 68 16 22 Z"
    fill="url(#unilibre-red)"
    filter="url(#shadow)"
  />

  <!-- Inner Gold Border -->
  <path
    d="M60 12 L98 26 C98 66 80 93 60 107 C40 93 22 66 22 26 Z"
    stroke="url(#gold-stroke)"
    stroke-width="2.5"
    fill="none"
  />

  <!-- Academic Torch / Beacon Ray (Top) -->
  <path
    d="M60 18 L64 28 L56 28 Z"
    fill="url(#unilibre-gold)"
  />

  <!-- Institutional "U" Symbol with Academic Elegance -->
  <path
    d="M38 34 V58 C38 70 48 80 60 80 C72 80 82 70 82 58 V34 H72 V58 C72 65 67 70 60 70 C53 70 48 65 48 58 V34 Z"
    fill="#FFFFFF"
  />

  <!-- Find Beacon / Compass Compassion Star at Heart -->
  <circle cx="60" cy="54" r="7" fill="url(#unilibre-gold)" />
  <circle cx="60" cy="54" r="3.5" fill="#C8102E" />

  <!-- University Gold Banner at Bottom -->
  <path
    d="M32 86 Q60 96 88 86 L86 92 Q60 102 34 92 Z"
    fill="url(#unilibre-gold)"
  />
</svg>
